# 服务器绑定的主机/接口。默认为空 ("")，绑定所有接口（IPv4 + IPv6）。
# 使用 "127.0.0.1" 或 "localhost" 可限制仅本机访问。
host: ''

# 服务器端口
port: 8317

# HTTPS 的 TLS 设置。启用后，服务器将使用提供的证书和密钥进行监听。
tls:
  enable: false
  cert: ''
  key: ''

# 管理 API 设置
remote-management:
  # 是否允许远程（非 localhost）管理访问。
  # 设为 false 时，仅 localhost 可访问管理端点（仍需提供密钥）。
  allow-remote: false

  # 管理密钥。如果此处提供明文值，启动时会自动进行哈希处理。
  # 所有管理请求（包括来自 localhost 的）都需要此密钥。
  # 留空则完全禁用管理 API（所有 /v0/management 路由返回 404）。
  secret-key: ''

  # 设为 true 时，禁用内置管理控制面板的资源下载和 HTTP 路由。
  disable-control-panel: false

  # 设为 true 时，禁用从 GitHub 自动定期后台更新管理面板（默认：false）。
  # 启用后，仅在本地缺失时按需下载一次，之后不再自动更新。
  # disable-auto-update-panel: false

  # 管理控制面板的 GitHub 仓库。接受仓库 URL 或 releases API URL。
  panel-github-repository: 'https://github.com/router-for-me/Cli-Proxy-API-Management-Center'

# 认证目录（支持 ~ 表示主目录）
auth-dir: '~/.cli-proxy-api'
# 环境变量覆盖：CLIPROXY_AUTO_RELOAD_INTERVAL_SECONDS=<秒数>
# 留空或 <= 0 则禁用配置/认证文件的定期自动重载。

# 用于身份验证的 API 密钥
api-keys:
  - 'your-api-key-1'
  - 'your-api-key-2'
  - 'your-api-key-3'

# 启用调试日志
debug: false

# 启用 pprof HTTP 调试服务器（host:port）。为安全起见，请绑定到 localhost。
pprof:
  enable: false
  addr: '127.0.0.1:8316'

# 设为 true 时，禁用高开销的 HTTP 中间件功能，以降低高并发下每个请求的内存使用。
commercial-mode: false

# 使用无痕/隐私浏览模式打开 OAuth URL。
# 适用于在不退出当前会话的情况下用不同账号登录。
# 默认值：false（但 Kiro 认证默认为 true，以支持多账号）
incognito-browser: true

# 设为 true 时，将应用日志写入滚动文件而非标准输出
logging-to-file: false

# logs 目录下日志文件的最大总大小（MB）。超出时将删除最旧的日志文件直至符合限制。设为 0 则禁用。
logs-max-total-size-mb: 0

# 禁用请求日志时保留的最大错误日志文件数。
# 超出时将删除最旧的错误日志文件。默认为 10。设为 0 则禁用清理。
error-logs-max-files: 10

# 设为 false 时，禁用内存中的使用统计聚合
usage-statistics-enabled: false

# 多节点部署的分布式配置/认证同步。
# 要求所有节点共享相同的 PostgreSQL 存储和 Redis 实例。
distributed-sync:
  enabled: false
  node-id: ""
  channel: "cliproxy:distributed-sync:events"
  poll-interval-seconds: 30
  redis:
    addr: "127.0.0.1:6379"
    username: ""
    password: ""
    db: 0

# 代理 URL。支持 socks5/http/https 协议。示例：socks5://user:pass@192.168.1.1:1080/
# 每条记录的 proxy-url 也支持 "direct" 或 "none"，以显式绕过全局代理和环境代理。
proxy-url: ""

# 设为 true 时，无前缀的模型请求仅使用没有前缀的凭据（前缀 == 模型名时除外）。
force-model-prefix: false

# 设为 true 时，将过滤后的上游响应头转发给下游客户端。
# 默认为 false（禁用）。
passthrough-headers: false

# 可选的异步请求审计 hook，用于把请求体特征与执行结果发往外部分析端。
# 支持 http(s) 端点和 Unix domain socket（unix:///path/to/hook.sock）。
# request-audit:
#   enable: false
#   endpoint: "unix:///tmp/cliproxy-codex-audit.sock"
#   providers:
#     - codex
#   queue-size: 256
#   timeout-seconds: 5
#   # JSON 请求/响应体会先做压缩再截断：
#   # 长度超过 6 的数组只保留前 3 和后 3；
#   # 长度超过 100 的字符串只保留前 50 和后 50。
#   max-body-bytes: 262144

# 请求重试次数。当 HTTP 响应码为 403、408、500、502、503 或 504 时会进行重试。
request-retry: 1

# 单次失败请求最多尝试的不同凭据数量。
# 设为 0 则保持旧行为（尝试所有可用凭据）。
max-retry-credentials: 0

# 冷却中的凭据最长等待时间（秒），超时后触发重试。
max-retry-interval: 30

# 设为 true 时，全局禁用 auth/model 的冷却调度，避免失败状态后的黑窗期。
disable-cooling: false

# 配额超限行为
quota-exceeded:
  switch-project: true # 配额超限时是否自动切换到其他项目
  switch-preview-model: true # 配额超限时是否自动切换到预览模型
  antigravity-credits: true # 是否对 Antigravity 的 quota_exhausted 429 额外重试一次，并启用 enabledCreditTypes=["GOOGLE_ONE_AI"]

# 运行时认证清理策略
auth-runtime:
  unauthorized-delete-threshold: 1 # 连续 N 次 401 响应后删除文件型认证
  unauthorized-delete-window-seconds: 600 # 连续 401 阈值的滚动时间窗口

# 运行时认证维护扩展。
auth-maintenance:
  delete-quota-exceeded: false # 历史兼容开关；额度用尽账号现在自动禁用，不自动删除。
  disable-status-codes: [500,401,502,504] # 匹配上游 HTTP 状态码时禁用文件型运行时认证；429 现在自动禁用，无需重复配置。
  codex-max-request-count: 0 # 完成 N 次请求后删除文件型 Codex 认证；0 表示禁用。
  codex-quota-check-request-interval: 2 # 每完成 N 次请求探测一次 Codex 用量；若探测返回 401 则删除文件型认证。0 表示禁用。

# 多凭据匹配时的路由策略。
routing:
  strategy: 'round-robin' # round-robin（默认），fill-first，success-rate，simhash
  # success-rate:
  #   half-life-seconds: 1800 # 成功率 EMA 半衰期，默认 1800 秒
  #   explore-rate: 0.02      # 探索概率，范围 [0,1]，默认 0.02
  # simhash:
  #   pool-size: 10               # 全局虚拟池目标大小，默认 10
  #   admit-cooldown-seconds: 1   # 池首次填满后，新 auth 再入池的最小间隔，默认 1 秒

# 设为 true 时，启用 WebSocket API（/v1/ws）的身份验证。
ws-auth: false

# 大于 0 时，对非流式响应每 N 秒发送空行，以防止空闲超时。
# 设为 true 时，启用 Gemini CLI 内部端点（/v1internal:*）。
# 为安全起见默认关闭。
enable-gemini-cli-endpoint: false

# 大于 0 时，对非流式响应每 N 秒发送空行，以防止空闲超时。
nonstream-keepalive-interval: 0

# 流式行为（SSE 保活 + 安全引导重试）。
# streaming:
#   keepalive-seconds: 15   # 默认值：0（禁用）。<= 0 则禁用保活。
#   bootstrap-retries: 1    # 默认值：0（禁用）。在发送第一个字节之前的重试次数。

