# Claude API 请求的默认请求头。Claude Code 发布新版本时需要更新。
# 在传统模式下，user-agent/package-version/runtime-version/timeout 用作客户端省略时的回退值，
# 而 OS/arch 仍由运行时派生。启用 stabilize-device-profile 后，OS/arch 保持固定为以下基线值，
# 而 user-agent/package-version/runtime-version 生成一个仍可升级到较新官方 Claude 客户端版本的软件指纹。
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.44 (external, sdk-cli)"
#   package-version: "0.74.0"
#   runtime-version: "v24.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   stabilize-device-profile: false  # 可选，默认 false；设为 true 启用按认证/API 密钥的指纹固定

# Codex OAuth 模型请求的默认请求头。
# 仅在客户端未发送请求头时用于文件型/OAuth Codex 请求。
# `user-agent` 适用于 HTTP 和 WebSocket 请求；
# `beta-features` 仅适用于 WebSocket 请求。不适用于 codex-api-key 条目。
# `codex-mimic.mode` 可用于把更接近 Codex CLI 的头部特征固定下来；
# `safe` 会保留有价值的会话/请求标识并让 compact 非流请求回到 `/responses` 主链，
# `strict` 会进一步强制覆盖签名型头部；默认 `off`。
# codex-mimic:
#   mode: "safe"
#   # strict:
#   #   force-turn-metadata: true   # 严格模式下，缺失时补 "{}"
#   #   force-turn-state: true      # 严格模式下，WS 缺失时补 turn-state；若同时开启 stable-*，会带稳定派生的 id
#   #   include-timing-metrics: true # 严格模式下，WS 缺失时补 "true"
#   #   stable-request-id: true     # 严格模式下，基于 continuity/session_id 稳定派生 request id
#   #   stable-turn-id: true        # 严格模式下，缺失时补稳定派生的 {"turn_id":"..."}
#
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.116.0 (Mac OS 26.0.1; arm64) Apple_Terminal/464"
#   beta-features: "multi_agent"

