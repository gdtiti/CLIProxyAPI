# 全局 OAuth 模型名称别名（按通道）
# 这些别名会同时影响模型列表和请求路由中的模型 ID 重命名。
# 支持的通道：gemini-cli、vertex、aistudio、antigravity、claude、codex、qwen、iflow、kiro、github-copilot、kimi。
# 注意：别名不适用于 gemini-api-key、codex-api-key、claude-api-key、openai-compatibility、vertex-api-key 或 ampcode。
# 注意：由于别名会同时影响合并后的 /v1 模型列表与请求路由，跨提供商复用同名别名时可能产生歧义。
# `/api/provider/{provider}/...` 只能帮助选择协议入口，最终推理后端仍可能跟随解析后的模型或别名。
# 若需要严格绑定后端，请使用唯一别名、唯一前缀，或避免重叠名称。
# 可以对同一 name 配置不同 alias，以暴露多个客户端模型名称。
oauth-model-alias:
  antigravity:
    - name: "rev19-uic3-1p"
      alias: "gemini-2.5-computer-use-preview-10-2025"
    - name: "gemini-3-pro-image"
      alias: "gemini-3-pro-image-preview"
    - name: "gemini-3-pro-high"
      alias: "gemini-3-pro-preview"
    - name: "gemini-3-flash"
      alias: "gemini-3-flash-preview"
    - name: "claude-sonnet-4-5"
      alias: "gemini-claude-sonnet-4-5"
    - name: "claude-sonnet-4-5-thinking"
      alias: "gemini-claude-sonnet-4-5-thinking"
    - name: "claude-opus-4-5-thinking"
      alias: "gemini-claude-opus-4-5-thinking"
